spring.application.name=demo
# Atomikos Configuration
spring.jta.transaction-manager-id=my-mysql-app-id
spring.jta.log-dir=transaction-logs

# Primary MySQL Datasource
primary.datasource.xa-datasource-class-name=com.mysql.cj.jdbc.MysqlXADataSource
primary.datasource.url=jdbc:mysql://localhost:3306/db1
primary.datasource.username=deiu
primary.datasource.password=password
primary.datasource.max-pool-size=20
primary.datasource.unique-resource-name=primaryMysqlDS

# Secondary MySQL Datasource
secondary.datasource.xa-datasource-class-name=com.mysql.cj.jdbc.MysqlXADataSource
secondary.datasource.url=jdbc:mysql://localhost:3306/db2
secondary.datasource.username=deiu
secondary.datasource.password=password
secondary.datasource.max-pool-size=20
secondary.datasource.unique-resource-name=secondaryMysqlDS

# Atomikos JTA configuration for distributed transactions
spring.jta.atomikos.properties.log-base-dir=target/atomikos-tx-logs
spring.jta.atomikos.properties.checkpoint-interval=500
spring.jta.atomikos.properties.threaded-two-phase-commit=true
spring.jta.enabled=true
